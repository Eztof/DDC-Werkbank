name: Bauen

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bauen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Oberfläche bauen und testen
        run: npm test
      - name: Auslieferung (exe + ui + ZIP)
        run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: DDC-Werkbank
          path: dist/DDC-Werkbank/
      - name: Release bei Versions-Tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
